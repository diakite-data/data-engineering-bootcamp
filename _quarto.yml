# ==============================================================================
# 💬 COMMENTS (GISCUS)
# ==============================================================================

comments:
  giscus:
    repo: "diakite-data/data-engineering-bootcamp"
    repo-id: "R_kgDOQjHMsg"
    category: "General"
    category-id: "DIC_kwDOQjHMss4CzeOO"
    mapping: pathname
    reactions-enabled: true
    input-position: top
    theme: preferred_color_scheme
    language: fr
    loading: lazy

# ==============================================================================
# 🎨 FORMAT HTML GLOBAL
# ==============================================================================

format:
  html:
    theme:
      light: [cosmo, styles.css]
      dark: [cyborg, styles.css]
    
    # Code
    code-fold: true
    code-summary: "Voir le code"
    code-tools: false
    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    highlight-style: dracula
    
    # Table of Contents
    toc: true
    toc-depth: 3
    toc-title: "📑 Sommaire"
    toc-expand: 2
    
    # Layout
    page-layout: article
    grid:
      sidebar-width: 280px
      body-width: 900px
      margin-width: 250px
    
    # Navigation
    smooth-scroll: true
    anchor-sections: true
    link-external-icon: true
    link-external-newwindow: true
    
    # Other
    number-sections: false
    fig-responsive: true
    self-contained: false
    
    # Include - Header (fonts, meta, SEO + Google Translate)
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
          <meta name="author" content="Diakite Data">
          <meta name="keywords" content="data engineering, spark, kafka, python, kubernetes, lakehouse, delta lake, bootcamp, formation, tutoriel">
          <meta name="robots" content="index, follow">
          <link rel="canonical" href="https://diakite-data.github.io/data-engineering-bootcamp">
          
          <!-- Google Translate Widget -->
          <script type="text/javascript">
          function googleTranslateElementInit() {
            new google.translate.TranslateElement({
              pageLanguage: 'fr',
              includedLanguages: 'en,fr',
              layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
              autoDisplay: false
            }, 'google_translate_element');
          }
          </script>
          <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    # Include - After Body (Reading progress + Sidebar toggle)
    include-after-body:
      - text: |
          <!-- Reading Progress Indicator -->
          <div class="reading-progress" aria-hidden="true"></div>
          
          <!-- UI Enhancement Scripts -->
          <script src="/bootcamp-ui.js"></script>
          <script src="/sidebar-toggle.js"></script>

# ==============================================================================
# 📓 JUPYTER / NOTEBOOKS
# ==============================================================================

# Exécution désactivée - affiche le code sans l'exécuter
execute:
  enabled: false
  echo: true

# ==============================================================================
# 🔧 METADATA FILES
# ==============================================================================

metadata-files:
  - includes/ipynb-button.yml

# ==============================================================================
# 📁 RESOURCES
# ==============================================================================

resources:
  - assets/images/**
  - assets/data/**
  - sidebar-toggle.js
  - notebooks/**/*.csv
  - notebooks/**/*.json
  - notebooks/**/*.parquet
  - bootcamp-ui.js
