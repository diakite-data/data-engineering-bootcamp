# ==============================================================================
# 🚀 BOOTCAMP DATA ENGINEERING - FROM ZERO TO HERO
# ==============================================================================
# Configuration Quarto pour le site web du bootcamp
# Structure : Débutant (01-13) → Intermédiaire (14-26) → Avancé (27-35)
# ==============================================================================

project:
  type: website
  output-dir: _site
  preview:
    port: 4200
    browser: true

# ==============================================================================
# 🌍 LANGUE & FORMAT
# ==============================================================================

lang: fr
date-format: "D MMMM YYYY"

# ==============================================================================
# 🌐 WEBSITE CONFIGURATION
# ==============================================================================

website:
  title: "Bootcamp Data Engineering"
  google-analytics: "G-NZSBZFMZN7"
  description: "Programme complet Data Engineering — Du débutant au Senior Engineer"
  site-url: "https://diakite-data.github.io/data-engineering-bootcamp"
  repo-url: "https://github.com/diakite-data/data-engineering-bootcamp"
  repo-actions: [source, issue, edit]
  
  # Favicon & Branding
  favicon: assets/images/favicon.svg
  
  # Navigation améliorée
  page-navigation: true
  bread-crumbs: true
  back-to-top-navigation: true
  reader-mode: true
  
  # Open Graph / Social Media
  open-graph:
    locale: fr_FR
    site-name: "Bootcamp Data Engineering"
  twitter-card:
    creator: "@diakite_data"
    site: "@diakite_data"
  
